[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lanzamiento-camaras"
version = "1.0.0"
description = "Cuántas unidades pedir de un producto nuevo: demanda por segmento, escenarios de cuota y una encuesta limpia. Datos sintéticos."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["lanzamiento"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["lanzamiento"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
